# 预约系统默认分支 dev 的 .piper.yml。
enabled: true
dryRun: true
welcome:
  issue: 感谢反馈。请按 Issue 模板补充问题信息。新功能和新 UI 请先在 issue 中讨论；Bug 修复可以直接提交 PR。
  pr: 普通贡献向 dev 提交；main 为生产分支。修改代码后，继续推送到当前分支。
  merged: 感谢贡献。
  image: ''
  guide: https://github.com/NEUP-Net-Depart/Pioneer-appointment-system/issues/39
labels:
  - name: bug
    titlePrefixes: ['fix:', 'fix(']
    branches: ['fix/**', 'fix-*']
  - name: enhancement
    titlePrefixes: ['feat:', 'feat(']
    branches: ['feat/**']
  - name: documentation
    files: ['docs/**', '**/*.md']
  - name: area/ci
    files: ['.github/**']
    reviewers: []
    reviewerCount: 2
    minApprovals: 2
    highRisk: true
reviewers:
  pool: [] # 审查者 GitHub 登录名。
  count: 1
  remindHours: 24
  rotateHours: 48
merge:
  # 检查名与 GitHub Check Run app.id。
  requiredChecks: [test]
  trustedCheckAppIds: []
  minApprovals: 1
  auto: false
  allowedBases: [dev]
  protectedBranches: [main]
  highRiskFiles: ['.github/**', 'migrations/**', '**/migrations/**', '.piper.yml', '**/auth*', '**/security*']
  highRiskLabels: [security, high-risk]
backport:
  enabled: false
  targets: []
  maxFiles: 50
release:
  enabled: true
  source: dev
  target: main
  timezone: Asia/Shanghai
  weekday: 4
  hour: 18 # 北京时间周四 18:00。
  version: patch
  initialVersion: v0.1.0
  deploymentWorkflow: check.yml
  deploymentJob: release
  requiredChecks: [test]
  minApprovals: 1
